name: Testing and Linting

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    services:
      mongodb:
        image: mongo:4.2
        ports:
          - 27017:27017
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Build web components
      run: |
        cd girder_collection_review/web_client
        npm ci
        npm run build
    # NOTE: no JS/pug/stylus lint step. Those linters are configured in the girder checkout's
    # root package.json, not here, so they only run locally via the plugins/ symlink. Adding
    # eslint/pug-lint/stylelint configs to web_client/ would let this move into CI.
    - name: Cache tox environments
      uses: actions/cache@v4
      with:
        path: .tox
        key: ${{ matrix.python-version }}-tox-${{ hashFiles('setup.py', 'requirements-dev.txt') }}
    - name: Run Linter
      run: tox -e lint -- girder_collection_review
    - name: Run Tests with coverage
      env:
        GIRDER_MAX_CURSOR_TIMEOUT_MS: 60000
      run: tox -e pytest
