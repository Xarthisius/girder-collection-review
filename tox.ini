[tox]
envlist = lint,pytest
skipsdist = false

[gh-actions]
python =
  3.12: pytest, lint

[testenv]
basepython = python3
package = wheel
wheel_build_env = .pkg

[testenv:pytest]
deps =
  -rrequirements-dev.txt
commands =
  pytest --verbose                        \
         --strict-markers                 \
         --cov=girder_collection_review   \
         --cov-report=xml                 \
         -n {env:PYTEST_XDIST_N:4}        \
         {posargs}

[testenv:lint]
skip_install = true
skipdist = true
deps =
  ruff
commands =
  ruff check .

[testenv:format]
skip_install = true
skipdist = true
deps =
  ruff
commands =
  ruff format .
  ruff check --fix .

# NOTE: pytest reads [pytest] from tox.ini, not [tool:pytest] (that form is only honored in
# setup.cfg). girder-jsonforms uses [tool:pytest] here, which pytest silently ignores.
[pytest]
cache_dir = build/test/pytest_cache
junit_family = xunit2
testpaths = girder_collection_review/tests
